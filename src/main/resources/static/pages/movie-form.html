<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opret film – Kinotek</title>
    <link rel="stylesheet" href="../css/stylesheet.css">
</head>
<body>
<header>
    <nav aria-label="Hovednavigation">
        <a class="logo" href="../index.html">Kinotek</a>
        <a href="movie-admin.html">Administrer film</a>
    </nav>
</header>
<main>
    <h1 id="form-heading">Opret film</h1>
    <form id="movie-form" class="movie-form">
        <label for="title">Titel</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Beskrivelse</label>
        <textarea id="description" name="description" rows="5"></textarea>

        <label for="duration">Spilletid (minutter)</label>
        <input id="duration" name="duration" type="number" min="1" required>

        <label for="genre">Genrer (hold Ctrl/Cmd for at vælge flere)</label>
        <select id="genre" name="genre" multiple size="8"></select>

        <label for="ageRating">Aldersgrænse</label>
        <select id="ageRating" name="ageRating" required></select>

        <label for="imageRef">Plakat (billed-URL)</label>
        <input id="imageRef" name="imageRef" type="url" placeholder="https://...">

        <label for="imdbRef">IMDb-link</label>
        <input id="imdbRef" name="imdbRef" type="url" placeholder="https://www.imdb.com/title/...">

        <button id="btn-submit" type="submit">Opret film</button>
    </form>
    <p id="status" role="status"></p>
</main>
<script type="module" src="../js/movieForm.js"></script>
</body>
</html>
